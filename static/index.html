<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Deteksi Kesegaran Daging Ayam</title>
  <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>

<body>

<h1>Deteksi Kesegaran Daging Ayam</h1>

<div class="container">

  <!-- KIRI -->
  <div class="left-panel">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="camera-select">
      <label>Pilih Kamera:</label>
      <select id="cameraSelect"></select>
    </div>

    <!-- UPLOAD -->
    <div class="upload-box">
      <label>Upload Gambar:</label><br>

      <input type="file" id="fileInput" accept="image/*">

      <div class="btn-group">
        <button onclick="uploadImage()">Upload & Prediksi</button>
        <button onclick="removeImage()" class="btn-danger">Hapus Foto</button>
      </div>

      <img id="previewImg">
    </div>
  </div>

  <!-- KANAN -->
  <div class="right-panel">
    <h2>Status</h2>
    <p id="cam-status">Kamera belum aktif</p>

    <div id="result">
      <p>Belum ada prediksi</p>
    </div>
  </div>

</div>

<!-- CONTROL -->
<div class="controls">
  <button onclick="toggleCamera()" id="btn-cam">Kamera ON</button>
  <button onclick="predict()">Prediksi Kamera</button>
</div>

<script src="/static/js/script.js?v=3"></script>

</body>
</html>
