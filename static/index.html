<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Deteksi Kesegaran Daging Ayam</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<h1>Deteksi Kesegaran Daging Ayam</h1>

<div class="container">

  <!-- KIRI: KAMERA -->
  <div class="left-panel">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="camera-select">
      <label>Pilih Kamera:</label>
      <select id="cameraSelect"></select>
    </div>
  </div>

  <!-- KANAN: HASIL -->
  <div class="right-panel">
    <h2>Status</h2>
    <p id="cam-status">Kamera belum aktif</p>

    <div id="result">
      <p>Belum ada prediksi</p>
    </div>
  </div>

</div>

<!-- BAWAH: CONTROL -->
<div class="controls">
  <button onclick="toggleCamera()" id="btn-cam">Kamera ON</button>
  <button onclick="detectMeat()">Deteksi</button>
  <button onclick="predict()">Prediksi</button>
</div>

<script src="/static/js/script.js"></script>

</body>
</html>
