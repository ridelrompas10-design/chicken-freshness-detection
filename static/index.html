<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deteksi Kesegaran Daging Ayam</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="topbar">
  <div class="title">Deteksi Kesegaran Daging Ayam</div>
  <div id="clock" class="clock">--:--:--</div>
</div>

<div class="grid2">

  <!-- Kamera -->
  <div class="card">
    <div class="card-title">Kamera</div>

    <div class="cam-box">
      <video id="video" autoplay playsinline></video>
      <span id="badge" class="badge off">Kamera belum aktif</span>
    </div>

    <div class="btn-row">
      <button id="btn-cam" class="btn primary" onclick="toggleCamera()">Kamera ON</button>
      <button id="btn-pred" class="btn secondary" onclick="predict()">Prediksi</button>
    </div>
  </div>

  <!-- Sensor -->
  <div class="card">
    <div class="card-title">
      Sensor Kadar Air
      <span id="sdot" class="dot off"></span>
      <span id="stxt" class="dim">Menghubungkan...</span>
    </div>

    <div class="sitem"><span class="dim">Sensor 1</span><span id="s1" class="bold">- %</span></div>
    <div class="sitem"><span class="dim">Sensor 2</span><span id="s2" class="bold">- %</span></div>
    <div class="sitem"><span class="dim">Sensor 3</span><span id="s3" class="bold">- %</span></div>

    <div class="divider"></div>

    <div class="sitem">
      <span class="dim">Rata-rata</span>
      <span id="avg" class="bold big">- %</span>
    </div>

    <div id="swarn" class="warn" style="display:none"></div>
  </div>

</div>

<div class="grid3">

  <!-- Hasil Prediksi -->
  <div class="card highlight-card">
    <div class="card-title">Hasil Prediksi</div>

    <div id="hlabel" class="result-label">-</div>
    <div id="hconf"  class="small dim"></div>

    <div class="divider"></div>

    <div class="sitem"><span class="dim">Segar</span><span id="vsegar" class="green">- %</span></div>
    <div class="sitem"><span class="dim">Setengah</span><span id="vsetengah" class="orange">- %</span></div>
    <div class="sitem"><span class="dim">Busuk</span><span id="vbusuk" class="red">- %</span></div>

    <div id="hsumber" class="small dim mt"></div>
  </div>

  <!-- Ketahanan -->
  <div class="card">
    <div class="card-title">Ketahanan Daging</div>

    <div id="durasi" class="durasi">-</div>
    <div id="saran"  class="small dim"></div>
    <div id="est"    class="small dim"></div>
  </div>

  <!-- Kondisi -->
  <div class="card">
    <div class="card-title">Kondisi Sensor</div>

    <div id="kondisi" class="small dim">Menunggu data...</div>

    <div class="divider"></div>

    <div class="dim small">Update terakhir</div>
    <div id="waktu" class="small"></div>

    <div class="divider"></div>

    <div class="dim small">Sumber</div>
    <div id="sumber" class="small"></div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
